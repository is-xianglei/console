<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ForgeOps Agent Platform V1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/lucide-static@0.469.0/font/lucide.css">
  <style>
    :root {
      --font-ui: 'Instrument Sans', 'Noto Sans SC', sans-serif;
      --font-body: 'DM Sans', 'Noto Sans SC', sans-serif;
      --font-data: 'IBM Plex Mono', monospace;
      --bg-deep: #101010;
      --bg-panel: #1C1C1C;
      --bg-surface: #232323;
      --bg-elevated: #2A2A2A;
      --bg-card: #2F2F2F;
      --bg-hover: #363636;
      --bg-active: #3D3D3D;
      --border: #363636;
      --border-subtle: #2A2A2A;
      --border-dim: #272727;
      --border-visible: #3D3D3D;
      --border-strong: #4A4A4A;
      --text-primary: #EEECE8;
      --text-secondary: #A8A29E;
      --text-muted: #8A8480;
      --text-dim: #6B6560;
      --accent-agent: #2DD4BF;
      --accent-agent-hover: #5EEAD4;
      --accent-agent-dim: rgba(45, 212, 191, .12);
      --accent-agent-glow: rgba(45, 212, 191, .35);
      --status-success: #34D399;
      --status-warning: #FBBF24;
      --status-error: #F87171;
      --status-info: #60A5FA;
      --status-think: #A78BFA;
      --radius-sm: 2px;
      --radius-control: 4px;
      --radius-md: 6px;
      --radius-lg: 10px;
      --ease-out: cubic-bezier(.16, 1, .3, 1);
      --ease-in-out: cubic-bezier(.65, 0, .35, 1);
      --sidebar-w: 276px;
      --context-w: 356px;
    }

    [data-theme="light"] {
      --bg-deep: #F4F2EE;
      --bg-panel: #E5E2DD;
      --bg-surface: #D8D4CE;
      --bg-elevated: #C9C5BE;
      --bg-card: #EEECE8;
      --bg-hover: #F0EEE9;
      --bg-active: #EEECE8;
      --border: #C9C5BE;
      --border-subtle: #D8D4CE;
      --border-dim: #E5E2DD;
      --border-visible: #A8A29E;
      --border-strong: #8A8480;
      --text-primary: #101010;
      --text-secondary: #6B6560;
      --text-muted: #8A8480;
      --text-dim: #A8A29E;
      --accent-agent: #0D9488;
      --accent-agent-hover: #0F766E;
      --accent-agent-dim: rgba(13, 148, 136, .1);
      --accent-agent-glow: rgba(13, 148, 136, .25);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: var(--bg-deep);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 13px;
      letter-spacing: 0;
    }
    button, input, textarea, select { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 1px solid var(--accent-agent);
      box-shadow: 0 0 0 2px var(--accent-agent-dim);
    }
    ::selection { background: var(--accent-agent-dim); color: var(--text-primary); }
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }

    .app-shell { height: 100%; display: grid; grid-template-rows: 48px minmax(0, 1fr); }
    .command-bar {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      display: grid;
      grid-template-columns: 240px minmax(260px, 620px) 1fr;
      align-items: center;
      gap: 16px;
      padding: 0 12px;
      position: relative;
      z-index: 30;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .hex-mark {
      width: 24px; height: 26px; flex: 0 0 auto;
      background: var(--accent-agent);
      clip-path: polygon(50% 0, 95% 25%, 95% 75%, 50% 100%, 5% 75%, 5% 25%);
      position: relative;
    }
    .hex-mark::after {
      content: ''; position: absolute; inset: 3px; background: var(--bg-panel);
      clip-path: inherit;
    }
    .brand-name { font: 700 12px var(--font-ui); letter-spacing: .16em; white-space: nowrap; }
    .brand-env { font: 500 9px var(--font-data); color: var(--accent-agent); border-left: 1px solid var(--border); padding-left: 10px; }
    .command-search {
      height: 30px; background: var(--bg-surface); border: 1px solid var(--border);
      border-radius: var(--radius-control); display: flex; align-items: center; gap: 8px;
      padding: 0 10px; color: var(--text-muted); cursor: pointer; transition: 150ms var(--ease-out);
    }
    .command-search:hover { background: var(--bg-elevated); border-color: var(--border-strong); }
    .command-search span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .command-actions { display: flex; justify-content: flex-end; align-items: center; gap: 4px; }
    .icon-btn {
      width: 32px; height: 32px; border: 0; border-radius: var(--radius-control);
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; color: var(--text-muted); cursor: pointer; transition: 150ms var(--ease-out);
    }
    .icon-btn:hover { background: var(--bg-surface); color: var(--text-primary); }
    .icon-btn:active { transform: scale(.95); }
    .icon-btn i, .rail-item i { font-size: 16px; }
    .avatar {
      width: 27px; height: 27px; border: 1px solid var(--border-strong); border-radius: 50%;
      display: grid; place-items: center; background: var(--bg-elevated); color: var(--text-secondary);
      font: 600 10px var(--font-data); margin-left: 5px; cursor: pointer;
    }

    .body-grid { min-height: 0; display: grid; grid-template-columns: 48px var(--sidebar-w) minmax(0, 1fr); }
    .activity-rail {
      background: var(--bg-panel); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 4px;
      position: relative; z-index: 20;
    }
    .rail-item {
      width: 36px; height: 36px; border: 0; border-radius: var(--radius-md); background: transparent;
      color: var(--text-muted); display: flex; align-items: center; justify-content: center;
      cursor: pointer; position: relative; transition: 150ms var(--ease-out);
    }
    .rail-item:hover { background: var(--bg-surface); color: var(--text-secondary); }
    .rail-item.active { color: var(--accent-agent); }
    .rail-item.active::before {
      content: ''; position: absolute; left: -6px; top: 10px; width: 2px; height: 16px;
      background: var(--accent-agent); border-radius: 0 2px 2px 0;
    }
    .rail-spacer { flex: 1; }

    .sidebar {
      min-width: 0; background: var(--bg-surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden; transition: width 250ms var(--ease-in-out), transform 250ms var(--ease-in-out);
    }
    .workspace-select { padding: 12px; border-bottom: 1px solid var(--border); }
    .workspace-label, .eyebrow {
      color: var(--text-dim); font: 600 9px var(--font-ui); letter-spacing: .1em; text-transform: uppercase;
    }
    .workspace-button {
      margin-top: 6px; width: 100%; min-width: 0; height: 38px; padding: 0 9px;
      background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-control);
      display: flex; align-items: center; gap: 9px; cursor: pointer; text-align: left;
    }
    .workspace-button:hover { border-color: var(--border-strong); background: var(--bg-card); }
    .workspace-symbol {
      width: 22px; height: 22px; background: var(--accent-agent-dim); color: var(--accent-agent);
      border-radius: 3px; display: grid; place-items: center; font: 600 9px var(--font-data); flex: 0 0 auto;
    }
    .workspace-copy { min-width: 0; flex: 1; }
    .workspace-name { display: block; font: 600 12px var(--font-ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .workspace-meta { display: block; color: var(--text-dim); font: 400 9px var(--font-data); margin-top: 2px; }
    .sidebar-head { display: flex; align-items: center; padding: 12px 12px 8px; gap: 8px; }
    .sidebar-head h2 { margin: 0; flex: 1; font: 700 11px var(--font-ui); letter-spacing: .14em; text-transform: uppercase; }
    .sidebar-head .icon-btn { width: 27px; height: 27px; }
    .sidebar-content { flex: 1; min-height: 0; overflow: auto; padding: 0 7px 16px; }
    .sidebar-foot { padding: 8px; border-top: 1px solid var(--border); }
    .capacity { background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: var(--radius-control); padding: 9px; }
    .capacity-line { display: flex; justify-content: space-between; color: var(--text-muted); font: 500 9px var(--font-data); }
    .capacity-track { height: 3px; margin-top: 7px; background: var(--bg-hover); }
    .capacity-fill { width: 68%; height: 100%; background: var(--accent-agent); }
    .nav-section { margin-top: 12px; }
    .section-label { padding: 0 8px 5px; color: var(--text-dim); font: 600 9px var(--font-ui); letter-spacing: .1em; text-transform: uppercase; }
    .side-item, .app-node, .session-item {
      width: 100%; border: 0; background: transparent; color: var(--text-secondary); border-radius: var(--radius-control);
      display: flex; align-items: center; gap: 8px; cursor: pointer; text-align: left;
      transition: 150ms var(--ease-out); min-width: 0;
    }
    .side-item { height: 34px; padding: 0 8px; }
    .side-item:hover, .app-node:hover, .session-item:hover { background: var(--bg-elevated); color: var(--text-primary); }
    .side-item.active { background: var(--accent-agent-dim); color: var(--accent-agent); }
    .side-item i { font-size: 14px; width: 16px; text-align: center; }
    .item-text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .count { color: var(--text-dim); font: 500 9px var(--font-data); }
    .app-node { height: 34px; padding: 0 6px; font-family: var(--font-ui); }
    .app-node.active { color: var(--text-primary); background: var(--bg-elevated); }
    .twisty { width: 14px; color: var(--text-dim); transition: transform 150ms var(--ease-out); font-size: 11px; }
    .app-group.collapsed .twisty { transform: rotate(-90deg); }
    .app-icon { width: 21px; height: 21px; display: grid; place-items: center; background: var(--bg-card); border: 1px solid var(--border); border-radius: 3px; color: var(--accent-agent); }
    .app-icon i { font-size: 12px; }
    .session-list { padding-left: 35px; }
    .app-group.collapsed .session-list { display: none; }
    .session-item { height: 29px; padding: 0 7px; color: var(--text-muted); font-size: 12px; position: relative; }
    .session-item::before { content: ''; position: absolute; left: -8px; width: 1px; height: 29px; background: var(--border); }
    .session-item.active { color: var(--text-primary); background: var(--bg-elevated); }
    .session-item.active::after { content: ''; position: absolute; left: 0; width: 2px; height: 12px; background: var(--accent-agent); }

    .main { min-width: 0; min-height: 0; background: var(--bg-deep); display: flex; flex-direction: column; }
    .main-head {
      height: 55px; flex: 0 0 auto; background: var(--bg-surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px; padding: 0 16px;
    }
    .mobile-menu { display: none; }
    .breadcrumb { flex: 1; min-width: 0; }
    .breadcrumb-path { color: var(--text-dim); font: 500 9px var(--font-data); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .breadcrumb-title { margin-top: 3px; display: flex; align-items: center; gap: 8px; min-width: 0; }
    .breadcrumb-title h1 { margin: 0; font: 600 15px var(--font-ui); letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .scope-badge, .status-badge {
      display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 7px;
      font: 600 9px var(--font-data); white-space: nowrap;
    }
    .scope-badge { background: var(--bg-elevated); color: var(--text-muted); border: 1px solid var(--border); }
    .status-badge { color: var(--status-success); background: rgba(52, 211, 153, .08); }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex: 0 0 auto; }
    .status-dot.nominal { background: var(--status-success); box-shadow: 0 0 6px rgba(52, 211, 153, .4); }
    .status-dot.warning { background: var(--status-warning); box-shadow: 0 0 6px rgba(251, 191, 36, .4); animation: pulse-dot 2s infinite; }
    .status-dot.error { background: var(--status-error); box-shadow: 0 0 6px rgba(248, 113, 113, .4); animation: pulse-dot 1s infinite; }
    .head-actions { display: flex; gap: 6px; align-items: center; }
    .segmented { display: flex; gap: 2px; padding: 2px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-control); }
    .segment {
      height: 25px; padding: 0 9px; border: 0; background: transparent; color: var(--text-muted);
      border-radius: 3px; font: 600 9px var(--font-ui); letter-spacing: .08em; cursor: pointer;
    }
    .segment:hover { color: var(--text-secondary); }
    .segment.active { background: var(--bg-surface); color: var(--accent-agent); }
    .primary-btn, .secondary-btn {
      min-height: 30px; border-radius: var(--radius-control); padding: 0 12px; display: inline-flex;
      align-items: center; justify-content: center; gap: 7px; cursor: pointer;
      font: 600 10px var(--font-ui); letter-spacing: .08em; text-transform: uppercase; transition: 150ms var(--ease-out);
    }
    .primary-btn { border: 1px solid rgba(45, 212, 191, .3); color: var(--accent-agent); background: var(--accent-agent-dim); }
    .primary-btn:hover { background: rgba(45, 212, 191, .16); box-shadow: 0 0 20px var(--accent-agent-glow); }
    .secondary-btn { border: 1px solid var(--border); color: var(--text-secondary); background: var(--bg-elevated); }
    .secondary-btn:hover { color: var(--text-primary); border-color: var(--border-strong); background: var(--bg-card); }
    .primary-btn:active, .secondary-btn:active { transform: scale(.97); }
    .primary-btn i, .secondary-btn i { font-size: 13px; }

    .runtime-strip {
      min-height: 36px; flex: 0 0 auto; border-bottom: 1px solid var(--border-subtle); background: var(--bg-panel);
      display: flex; align-items: center; gap: 0; padding: 0 16px; overflow-x: auto;
    }
    .runtime-stat { min-width: max-content; padding: 0 14px; border-right: 1px solid var(--border); font: 500 10px var(--font-data); color: var(--text-muted); }
    .runtime-stat:first-child { padding-left: 0; }
    .runtime-stat strong { color: var(--text-primary); font-weight: 600; }
    .runtime-stat.alert strong { color: var(--status-warning); }
    .runtime-spacer { flex: 1; min-width: 20px; }
    .sync-time { color: var(--text-dim); font: 400 9px var(--font-data); white-space: nowrap; }

    .work-area { min-height: 0; flex: 1; display: grid; grid-template-columns: minmax(380px, 1fr) var(--context-w); }
    .work-area.mode-chat { grid-template-columns: 1fr 0; }
    .work-area.mode-app { grid-template-columns: 0 1fr; }
    .conversation, .context-panel { min-width: 0; min-height: 0; overflow: hidden; }
    .work-area.mode-chat .context-panel, .work-area.mode-app .conversation { visibility: hidden; }
    .conversation { display: grid; grid-template-rows: minmax(0, 1fr) auto; background: var(--bg-deep); }
    .conversation-feed { overflow: auto; padding: 24px clamp(16px, 3vw, 44px); }
    .turn { max-width: 820px; margin: 0 auto 22px; animation: entry-appear 180ms var(--ease-out); }
    .turn-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; color: var(--text-dim); font: 500 9px var(--font-data); }
    .turn-role { color: var(--text-secondary); font: 700 10px var(--font-ui); letter-spacing: .1em; text-transform: uppercase; }
    .turn.user .turn-body { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px; }
    .turn-body { line-height: 1.65; color: var(--text-secondary); }
    .turn-body strong { color: var(--text-primary); font-weight: 600; }
    .diagnosis { margin-top: 12px; border-left: 2px solid var(--status-warning); background: var(--bg-panel); padding: 11px 13px; }
    .diagnosis-title { color: var(--text-primary); font: 600 12px var(--font-ui); margin-bottom: 5px; }
    .diagnosis p { margin: 0; }
    .cli-card { margin-top: 12px; font: 400 10px/1.65 var(--font-data); white-space: pre-wrap; color: var(--text-muted); overflow: hidden; }
    .cli-card .cli-head { color: var(--status-info); }
    .cli-card.result .cli-head { color: var(--status-success); }
    .action-row { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 7px; }
    .composer-wrap { padding: 12px clamp(16px, 3vw, 44px) 16px; background: var(--bg-deep); }
    .composer { max-width: 820px; margin: auto; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-md); transition: 150ms var(--ease-out); }
    .composer:focus-within { border-color: var(--accent-agent); box-shadow: 0 0 0 2px var(--accent-agent-dim); }
    .composer textarea { width: 100%; min-height: 48px; max-height: 130px; resize: none; border: 0; outline: 0; color: var(--text-primary); background: transparent; padding: 11px 12px 6px; font: 400 13px/1.45 var(--font-body); }
    .composer textarea::placeholder { color: var(--text-dim); }
    .composer-tools { height: 36px; display: flex; align-items: center; gap: 4px; padding: 0 7px 6px; }
    .context-chip { height: 24px; padding: 0 7px; border: 1px solid var(--border); border-radius: 3px; background: var(--bg-surface); color: var(--text-muted); font: 500 9px var(--font-data); display: inline-flex; align-items: center; gap: 5px; }
    .send-btn {
      margin-left: auto; width: 29px; height: 29px; border-radius: 50%; border: 0;
      background: var(--accent-agent); color: var(--bg-deep); display: grid; place-items: center; cursor: pointer;
      transition: 150ms var(--ease-out);
    }
    .send-btn:hover { background: var(--accent-agent-hover); box-shadow: 0 0 20px var(--accent-agent-glow); transform: scale(1.05); }
    .send-btn:active { transform: scale(.95); }

    .context-panel { border-left: 1px solid var(--border); background: var(--bg-panel); display: flex; flex-direction: column; }
    .context-head { min-height: 42px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); padding: 0 10px 0 13px; }
    .context-head h3 { flex: 1; margin: 0; font: 700 10px var(--font-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--text-secondary); }
    .context-body { min-height: 0; flex: 1; overflow: auto; }
    .plant-summary { padding: 14px; border-bottom: 1px solid var(--border); background: var(--bg-surface); }
    .plant-title { display: flex; justify-content: space-between; align-items: flex-start; }
    .plant-title h2 { margin: 0; font: 600 16px var(--font-ui); }
    .plant-title p { margin: 4px 0 0; color: var(--text-muted); font-size: 11px; }
    .health-value { color: var(--status-success); font: 600 22px var(--font-data); }
    .health-value small { font-size: 9px; color: var(--text-muted); }
    .line-tabs { display: flex; gap: 4px; margin-top: 14px; }
    .line-tab { border: 1px solid var(--border); background: var(--bg-panel); color: var(--text-muted); border-radius: 3px; padding: 4px 8px; font: 600 9px var(--font-data); cursor: pointer; }
    .line-tab.active { color: var(--accent-agent); border-color: rgba(45, 212, 191, .3); background: var(--accent-agent-dim); }
    .asset-list { padding: 8px 0; }
    .asset-list-head, .asset-row { display: grid; grid-template-columns: minmax(0, 1.5fr) .7fr .6fr; align-items: center; gap: 8px; padding: 0 14px; }
    .asset-list-head { height: 28px; color: var(--text-dim); font: 600 8px var(--font-data); letter-spacing: .08em; text-transform: uppercase; }
    .asset-row { min-height: 43px; border-top: 1px solid var(--border-subtle); font: 500 10px var(--font-data); cursor: pointer; }
    .asset-row:hover, .asset-row.active { background: var(--bg-surface); }
    .asset-name { display: flex; gap: 7px; align-items: center; min-width: 0; }
    .asset-name span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .health-bar { height: 3px; background: var(--bg-hover); margin-top: 5px; }
    .health-bar > span { display: block; height: 100%; background: var(--status-success); }
    .health-bar.warning > span { background: var(--status-warning); }
    .asset-reading { color: var(--text-secondary); }
    .asset-state { color: var(--status-success); }
    .asset-state.warning { color: var(--status-warning); }
    .detail-panel { border-top: 1px solid var(--border); padding: 14px; }
    .detail-title { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .detail-title strong { flex: 1; font: 600 12px var(--font-ui); }
    .measure-grid { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--border); }
    .measure { padding: 9px; border-right: 1px solid var(--border); background: var(--bg-elevated); }
    .measure:last-child { border-right: 0; }
    .measure-label { color: var(--text-dim); font: 600 8px var(--font-data); text-transform: uppercase; }
    .measure-value { margin-top: 4px; color: var(--text-primary); font: 600 11px var(--font-data); }
    .event-line { margin-top: 12px; padding-left: 11px; border-left: 1px solid var(--border-strong); color: var(--text-muted); font: 400 10px/1.6 var(--font-data); }

    .module-page { flex: 1; min-height: 0; overflow: auto; background: var(--bg-deep); }
    .module-intro { padding: 28px 32px 22px; border-bottom: 1px solid var(--border); background: var(--bg-panel); }
    .module-intro h2 { margin: 6px 0 7px; font: 600 22px var(--font-ui); }

    .module-toolbar { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }

    .overview-value { font: 600 24px var(--font-data); color: var(--text-primary); }
    .overview-label { margin-top: 4px; color: var(--text-muted); font: 600 9px var(--font-ui); letter-spacing: .08em; text-transform: uppercase; }
    .content-section { padding: 24px 32px; border-bottom: 1px solid var(--border-subtle); }
    .section-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .section-head h3 { margin: 0; flex: 1; font: 700 11px var(--font-ui); letter-spacing: .14em; text-transform: uppercase; }
    .section-head span { color: var(--text-dim); font: 500 9px var(--font-data); }
    .resource-table { border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
    .resource-head, .resource-row { display: grid; grid-template-columns: minmax(180px, 1.5fr) minmax(120px, .8fr) .6fr .7fr auto; align-items: center; gap: 12px; padding: 0 14px; }
    .resource-head { height: 33px; background: var(--bg-elevated); color: var(--text-dim); font: 600 9px var(--font-data); letter-spacing: .08em; text-transform: uppercase; }
    .resource-row { min-height: 52px; background: var(--bg-panel); border-top: 1px solid var(--border-subtle); }
    .resource-row:hover { background: var(--bg-surface); }
    .resource-name { min-width: 0; }
    .resource-name strong { display: block; font: 600 12px var(--font-ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .resource-name small { color: var(--text-dim); font: 400 9px var(--font-data); }
    .data-cell { color: var(--text-muted); font: 500 10px var(--font-data); }
    .resource-actions { display: flex; gap: 3px; }
    .app-market-grid { display: grid; grid-template-columns: repeat(3, minmax(220px, 1fr)); gap: 8px; }
    .market-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 15px; min-width: 0; transition: 150ms var(--ease-out); }
    .market-card:hover { background: var(--bg-surface); border-color: var(--border-strong); }
    .market-top { display: flex; gap: 10px; align-items: flex-start; }
    .market-icon { width: 34px; height: 34px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-control); display: grid; place-items: center; color: var(--accent-agent); }
    .market-icon i { font-size: 17px; }
    .market-copy { flex: 1; min-width: 0; }
    .market-copy h4 { margin: 0; font: 600 13px var(--font-ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .market-copy p { margin: 4px 0 0; color: var(--text-muted); line-height: 1.5; font-size: 11px; }
    .market-meta { display: flex; justify-content: space-between; margin: 14px 0 10px; color: var(--text-dim); font: 500 9px var(--font-data); }
    .review-state { font: 600 9px var(--font-data); }
    .review-state.pending { color: var(--status-warning); }
    .review-state.ok { color: var(--status-success); }

    .overlay { position: fixed; inset: 0; z-index: 100; background: rgba(0, 0, 0, .68); display: none; align-items: flex-start; justify-content: center; padding-top: min(14vh, 110px); }
    .overlay.open { display: flex; animation: fade-in 150ms var(--ease-out); }
    .modal { width: min(620px, calc(100vw - 32px)); max-height: min(72vh, calc(100dvh - 32px)); background: var(--bg-surface); border: 1px solid var(--border-visible); border-radius: var(--radius-lg); overflow: hidden; display: flex; flex-direction: column; }
    .modal-head { height: 48px; display: flex; align-items: center; gap: 9px; padding: 0 14px; border-bottom: 1px solid var(--border); }
    .modal-head h2 { margin: 0; flex: 1; font: 700 11px var(--font-ui); letter-spacing: .14em; text-transform: uppercase; }
    .command-input { width: 100%; height: 48px; border: 0; border-bottom: 1px solid var(--border); outline: 0; background: var(--bg-elevated); color: var(--text-primary); padding: 0 16px; font: 400 13px var(--font-body); }
    .command-results { min-height: 0; max-height: 440px; overflow: auto; padding: 8px; }
    .command-group-label { padding: 8px; color: var(--text-dim); font: 600 9px var(--font-ui); letter-spacing: .1em; text-transform: uppercase; }
    .command-result { width: 100%; min-height: 42px; border: 0; border-radius: var(--radius-control); color: var(--text-secondary); background: transparent; display: flex; align-items: center; gap: 10px; text-align: left; padding: 0 9px; cursor: pointer; }
    .command-result:hover, .command-result.active { background: var(--bg-elevated); color: var(--text-primary); }
    .command-result i { width: 20px; color: var(--accent-agent); }
    .command-result small { margin-left: auto; color: var(--text-dim); font: 500 9px var(--font-data); }
    .form-body { padding: 18px; overflow: auto; min-height: 0; flex: 1; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: var(--text-muted); font: 600 9px var(--font-ui); letter-spacing: .08em; text-transform: uppercase; }
    .field input, .field select, .field textarea { width: 100%; color: var(--text-primary); background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-control); padding: 8px 10px; }
    .field textarea { min-height: 76px; resize: vertical; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--border); }
    button:disabled { opacity: .35; pointer-events: none; }
    .empty-session { min-height: 52vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--text-muted); text-align: center; }
    .empty-session .hex-mark { width: 58px; height: 64px; opacity: .2; animation: glow-breathe 3s var(--ease-in-out) infinite; }
    .empty-session .hex-mark::after { background: var(--bg-deep); inset: 6px; }
    .empty-session h2 { margin: 0; color: var(--text-primary); font: 600 16px var(--font-ui); }
    .empty-session p { margin: 0; max-width: 360px; line-height: 1.6; }
    .workspace-menu { position: fixed; z-index: 80; width: 252px; background: var(--bg-elevated); border: 1px solid var(--border-visible); border-radius: var(--radius-md); padding: 6px; display: none; }
    .workspace-menu.open { display: block; animation: entry-appear 180ms var(--ease-out); }
    .workspace-option { width: 100%; height: 42px; border: 0; background: transparent; color: var(--text-secondary); border-radius: 4px; padding: 0 8px; display: flex; align-items: center; gap: 9px; text-align: left; cursor: pointer; }
    .workspace-option:hover { background: var(--bg-hover); color: var(--text-primary); }
    .workspace-option.active { color: var(--accent-agent); background: var(--accent-agent-dim); }
    .toast { position: fixed; right: 18px; bottom: 18px; z-index: 140; background: var(--bg-elevated); border: 1px solid var(--border-visible); border-left: 2px solid var(--accent-agent); border-radius: var(--radius-control); padding: 11px 14px; color: var(--text-secondary); transform: translateY(24px); opacity: 0; pointer-events: none; transition: 250ms var(--ease-out); }
    .toast.show { transform: translateY(0); opacity: 1; }

    @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
    @keyframes glow-breathe { 0%, 100% { opacity: .2; } 50% { opacity: .55; } }
    @keyframes entry-appear { from { transform: translateY(6px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

    @media (max-width: 1180px) {
      :root { --context-w: 330px; }
      .command-bar { grid-template-columns: 220px minmax(220px, 460px) 1fr; }
      .body-grid { grid-template-columns: 48px 250px minmax(0, 1fr); }
      .overview-stats { grid-template-columns: repeat(2, 1fr); }
      .overview-stat:nth-child(2) { border-right: 0; }
      .overview-stat:nth-child(-n+2) { border-bottom: 1px solid var(--border); }
      .app-market-grid { grid-template-columns: repeat(2, minmax(220px, 1fr)); }
    }
    @media (max-width: 900px) {
      .command-bar { grid-template-columns: 1fr auto; }
      .command-search { display: none; }
      .body-grid { grid-template-columns: 48px minmax(0, 1fr); }
      .sidebar { position: fixed; top: 48px; bottom: 0; left: 48px; width: min(300px, calc(100vw - 48px)); z-index: 60; transform: translateX(-110%); }
      .sidebar.mobile-open { transform: translateX(0); }
      .mobile-menu { display: inline-flex; }
      .work-area { grid-template-columns: 1fr; }
      .work-area .context-panel { display: none; }
      .work-area.mode-app .conversation { display: none; }
      .work-area.mode-app .context-panel { display: flex; visibility: visible; }
      .work-area.mode-chat .conversation { visibility: visible; }
      .segment[data-mode="split"] { display: none; }
      .resource-head, .resource-row { grid-template-columns: minmax(180px, 1fr) .8fr auto; }
      .resource-head > :nth-child(3), .resource-head > :nth-child(4), .resource-row > :nth-child(3), .resource-row > :nth-child(4) { display: none; }
    }
    @media (max-width: 620px) {
      .command-bar { padding: 0 8px; }
      .brand-env { display: none; }
      .command-actions .icon-btn:nth-child(1), .command-actions .icon-btn:nth-child(2) { display: none; }
      .body-grid { grid-template-columns: 42px minmax(0, 1fr); }
      .activity-rail { width: 42px; }
      .rail-item { width: 34px; }
      .sidebar { left: 42px; width: calc(100vw - 42px); }
      .main-head { padding: 0 8px; gap: 6px; }
      .breadcrumb-path, .scope-badge, .head-actions > .secondary-btn { display: none; }
      .runtime-strip { padding: 0 8px; }
      .conversation-feed { padding: 16px 12px; }
      .composer-wrap { padding: 8px; }
      .composer-tools .context-chip + .context-chip { display: none; }
      .module-intro, .content-section { padding-left: 16px; padding-right: 16px; }
      .module-intro h2 { font-size: 19px; }
      .overview-stats { grid-template-columns: 1fr 1fr; }
      .overview-stat { padding: 14px 16px; }
      .overview-value { font-size: 19px; }
      .app-market-grid { grid-template-columns: 1fr; }
      .resource-head, .resource-row { grid-template-columns: minmax(150px, 1fr) auto; }
      .resource-head > :nth-child(2), .resource-row > :nth-child(2) { display: none; }
      .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
    }
  </style>
</head>
<body data-theme="dark">
  <div class="app-shell">
    <header class="command-bar">
      <div class="brand">
        <span class="hex-mark" aria-hidden="true"></span>
        <span class="brand-name">FORGEOPS</span>
        <span class="brand-env">ENTERPRISE</span>
      </div>
      <button class="command-search" id="commandTrigger" aria-label="打开全局搜索">
        <i class="icon icon-search"></i><span>搜索应用、Agent、人员或输入命令</span>
      </button>
      <div class="command-actions">
        <button class="icon-btn" id="quickCreate" title="新建资源" aria-label="新建资源"><i class="icon icon-plus"></i></button>
        <button class="icon-btn" id="notifications" title="通知" aria-label="通知"><i class="icon icon-bell"></i></button>
        <button class="icon-btn" id="themeToggle" title="切换主题" aria-label="切换主题"><i class="icon icon-sun"></i></button>
        <button class="avatar" title="张工程师">ZE</button>
      </div>
    </header>

    <div class="body-grid">
      <nav class="activity-rail" aria-label="主导航">
        <button class="rail-item active" data-module="workbench" title="工作台" aria-label="工作台"><i class="icon icon-layout-dashboard"></i></button>
        <button class="rail-item" data-module="build" title="构建" aria-label="构建"><i class="icon icon-bot"></i></button>
        <button class="rail-item" data-module="market" title="应用市场" aria-label="应用市场"><i class="icon icon-blocks"></i></button>
        <button class="rail-item" data-module="governance" title="治理" aria-label="治理"><i class="icon icon-shield-check"></i></button>
        <button class="rail-item" data-module="organization" title="组织与权限" aria-label="组织与权限"><i class="icon icon-users"></i></button>
        <div class="rail-spacer"></div>
        <button class="rail-item" data-module="settings" title="平台设置" aria-label="平台设置"><i class="icon icon-settings"></i></button>
      </nav>

      <aside class="sidebar" id="sidebar">
        <div class="workspace-select">
          <div class="workspace-label">Workspace</div>
          <button class="workspace-button" id="workspaceTrigger">
            <span class="workspace-symbol">HM</span>
            <span class="workspace-copy"><span class="workspace-name" id="workspaceName">华东制造中心</span><span class="workspace-meta">PRODUCTION · 24 MEMBERS</span></span>
            <i class="icon icon-chevrons-up-down"></i>
          </button>
        </div>
        <div class="sidebar-head"><h2 id="sidebarTitle">应用与会话</h2><button class="icon-btn" id="sidebarAction" title="新建会话" aria-label="新建会话"><i class="icon icon-square-pen"></i></button></div>
        <div class="sidebar-content" id="sidebarContent"></div>
        <div class="sidebar-foot"><div class="capacity"><div class="capacity-line"><span>本月 Agent 用量</span><span>68%</span></div><div class="capacity-track"><div class="capacity-fill"></div></div></div></div>
      </aside>

      <main class="main" id="mainContent"></main>
    </div>
  </div>

  <div class="workspace-menu" id="workspaceMenu">
    <button class="workspace-option active" data-workspace="华东制造中心" data-code="HM" data-meta="PRODUCTION · 24 MEMBERS"><span class="workspace-symbol">HM</span><span class="workspace-copy"><span class="workspace-name">华东制造中心</span><span class="workspace-meta">生产环境 · 24 人</span></span></button>
    <button class="workspace-option" data-workspace="新能源电池事业部" data-code="EV" data-meta="PRODUCTION · 38 MEMBERS"><span class="workspace-symbol">EV</span><span class="workspace-copy"><span class="workspace-name">新能源电池事业部</span><span class="workspace-meta">生产环境 · 38 人</span></span></button>
    <button class="workspace-option" data-workspace="AI 应用实验室" data-code="LAB" data-meta="DEVELOPMENT · 12 MEMBERS"><span class="workspace-symbol">LAB</span><span class="workspace-copy"><span class="workspace-name">AI 应用实验室</span><span class="workspace-meta">开发环境 · 12 人</span></span></button>
    <button class="workspace-option" data-workspace="集团治理空间" data-code="ORG" data-meta="ORGANIZATION · READ ONLY" data-readonly="true"><span class="workspace-symbol">ORG</span><span class="workspace-copy"><span class="workspace-name">集团治理空间</span><span class="workspace-meta">组织级 · 只读</span></span></button>
  </div>

  <div class="overlay" id="commandOverlay" role="dialog" aria-modal="true" aria-label="全局搜索">
    <div class="modal">
      <div class="modal-head"><i class="icon icon-search"></i><h2>全局搜索</h2><button class="icon-btn modal-close" aria-label="关闭"><i class="icon icon-x"></i></button></div>
      <input class="command-input" id="commandInput" placeholder="搜索应用、会话、Agent、Team、Skill、MCP 或人员">
      <div class="command-results" id="commandResults"></div>
    </div>
  </div>

  <div class="overlay" id="formOverlay" role="dialog" aria-modal="true" aria-label="配置资源">
    <div class="modal">
      <div class="modal-head"><i class="icon icon-bot"></i><h2 id="formTitle">创建 Agent</h2><button class="icon-btn modal-close" aria-label="关闭"><i class="icon icon-x"></i></button></div>
      <div class="form-body">
        <div class="form-grid">
          <div class="field full"><label for="resourceName">名称</label><input id="resourceName" value="产线异常分析 Agent"></div>
          <div class="field"><label for="resourceModel">基础模型</label><select id="resourceModel"><option>Qwen3-32B-Factory</option><option>GPT-5 Enterprise</option><option>DeepSeek-R1-70B</option></select></div>
          <div class="field"><label for="resourceTeam">所属 Team</label><select id="resourceTeam"><option>设备可靠性 Team</option><option>质量管控 Team</option><option>生产排程 Team</option></select></div>
          <div class="field full"><label for="resourceDescription">职责与边界</label><textarea id="resourceDescription">分析设备实时数据与历史工单，识别异常原因并给出可审核的维修建议。禁止直接下发停机指令。</textarea></div>
          <div class="field"><label for="resourceScope">作用域</label><select id="resourceScope"><option>当前工作区</option><option>组织共享</option></select></div>
          <div class="field"><label for="resourcePolicy">治理策略</label><select id="resourcePolicy"><option>生产高风险操作需审批</option><option>只读诊断</option></select></div>
        </div>
      </div>
      <div class="modal-actions"><button class="secondary-btn modal-close">取消</button><button class="primary-btn" id="saveResource"><i class="icon icon-check"></i>保存草稿</button></div>
    </div>
  </div>

  <div class="toast" id="toast">操作已完成</div>

  <script>
    const state = {
      module: 'workbench',
      workspace: '华东制造中心',
      readonly: false,
      app: '设备健康中心',
      session: '泵组 A 异常排查',
      viewMode: 'split',
      theme: 'dark'
    };

    const apps = [
      { id: 'health', name: '设备健康中心', icon: 'activity', state: 'nominal', sessions: ['泵组 A 异常排查', '今日例行巡检', '7 月维护复盘'] },
      { id: 'quality', name: '质量缺陷分析', icon: 'scan-line', state: 'warning', sessions: ['批次 QC-0722 复核', '焊点缺陷归因'] },
      { id: 'schedule', name: '生产排程助手', icon: 'calendar-range', state: 'nominal', sessions: ['明日混线排产', '订单 SO-2847 插单评估'] },
      { id: 'energy', name: '能源优化调度', icon: 'gauge', state: 'nominal', sessions: ['峰谷电价优化'] }
    ];

    const moduleConfig = {
      build: { title: '构建资源', sections: [{ label: '智能体编排', items: [['Agents', 'bot', '12'], ['Teams', 'network', '5']] }, { label: '能力与连接', items: [['Models', 'cpu', '8'], ['Skills', 'wrench', '34'], ['MCP Servers', 'server-cog', '11']] }] },
      market: { title: '应用市场', sections: [{ label: '市场', items: [['发现', 'compass', ''], ['制造业应用', 'factory', '86'], ['已安装', 'package-check', '12'], ['版本更新', 'refresh-cw', '3']] }, { label: '开发者', items: [['开发者控制台', 'code-2', ''], ['我的上架', 'upload-cloud', '4'], ['审核队列', 'list-checks', '7']] }] },
      governance: { title: '治理控制台', sections: [{ label: '策略', items: [['策略与护栏', 'shield', '18'], ['评测集', 'flask-conical', '9'], ['风险事件', 'triangle-alert', '2']] }, { label: '可观测', items: [['运行追踪', 'route', ''], ['审计日志', 'scroll-text', ''], ['成本与配额', 'chart-no-axes-column', '68%']] }] },
      organization: { title: '组织与权限', sections: [{ label: '组织目录', items: [['部门', 'building-2', '14'], ['群组', 'users-round', '21'], ['人员', 'user-round', '286']] }, { label: '访问控制', items: [['角色', 'badge-check', '9'], ['权限策略', 'key-round', '17'], ['访问申请', 'inbox', '6']] }] },
      settings: { title: '平台设置', sections: [{ label: '工作空间', items: [['工作空间配置', 'panels-top-left', '4'], ['环境与密钥', 'key', ''], ['数据连接', 'database', '13']] }, { label: '平台', items: [['集成', 'plug', '8'], ['通知', 'bell', ''], ['平台参数', 'sliders-horizontal', '']] }] }
    };

    const mainContent = document.getElementById('mainContent');
    const sidebarContent = document.getElementById('sidebarContent');
    const sidebarTitle = document.getElementById('sidebarTitle');
    const toast = document.getElementById('toast');

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function renderWorkbenchSidebar() {
      sidebarTitle.textContent = '应用与会话';
      sidebarContent.innerHTML = `
        <div class="nav-section">
          <div class="section-label">运行中的应用</div>
          ${apps.map(app => `
            <div class="app-group ${app.name === state.app ? '' : 'collapsed'}" data-app="${app.name}">
              <button class="app-node ${app.name === state.app ? 'active' : ''}" title="${app.name}">
                <i class="icon icon-chevron-down twisty"></i>
                <span class="app-icon"><i class="icon icon-${app.icon}"></i></span>
                <span class="item-text">${app.name}</span>
                <span class="status-dot ${app.state}" title="${app.state === 'warning' ? '存在告警' : '运行正常'}"></span>
              </button>
              <div class="session-list">
                ${app.sessions.map(session => `<button class="session-item ${session === state.session && app.name === state.app ? 'active' : ''}" data-session="${session}" title="${session}"><span class="item-text">${session}</span></button>`).join('')}
              </div>
            </div>`).join('')}
        </div>
        <div class="nav-section">
          <div class="section-label">快捷入口</div>
          <button class="side-item" data-jump="market"><i class="icon icon-blocks"></i><span class="item-text">浏览应用市场</span></button>
          <button class="side-item" data-jump="build"><i class="icon icon-bot"></i><span class="item-text">管理 Agent 与 Team</span></button>
          <button class="side-item" data-jump="governance"><i class="icon icon-shield-check"></i><span class="item-text">治理与审计</span><span class="count">2</span></button>
        </div>`;

      sidebarContent.querySelectorAll('.app-node').forEach(button => button.addEventListener('click', () => {
        const group = button.closest('.app-group');
        const selectedApp = apps.find(item => item.name === group.dataset.app);
        const wasCollapsed = group.classList.contains('collapsed');

    function bindWorkbenchEvents() {

        const value = input.value.trim();

        input.value = '';
        feed.scrollTop = feed.scrollHeight;
      };
      document.getElementById('sendMessage').addEventListener('click', send);
      input.addEventListener('keydown', event => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); send(); } });
    }

      return `<div class="overview-stats"><div class="overview-stat"><div class="overview-value">86</div><div class="overview-label">制造业应用</div></div><div class="overview-stat"><div class="overview-value">12</div><div class="overview-label">已安装</div></div><div class="overview-stat"><div class="overview-value">3</div><div class="overview-label">可更新</div></div><div class="overview-stat"><div class="overview-value">7</div><div class="overview-label">待审核</div></div></div><section class="content-section"><div class="section-head"><h3>推荐给 ${state.workspace}</h3><span>按数据域与角色匹配</span></div><div class="app-market-grid">${marketApps.map(app => `<article class="market-card"><div class="market-top"><div class="market-icon"><i class="icon icon-${app[1]}"></i></div><div class="market-copy"><h4>${app[0]}</h4><p>${app[2]}</p></div></div><div class="market-meta"><span>${app[3]}</span><span>${app[4]}</span></div><button class="primary-btn install-btn" data-app="${app[0]}"><i class="icon icon-download"></i>安装</button></article>`).join('')}</div></section><section class="content-section"><div class="section-head"><h3>开发者上架</h3><span>4 个提交</span></div><div class="resource-table"><div class="resource-head"><span>应用</span><span>开发团队</span><span>审核状态</span><span>版本</span><span>操作</span></div><div class="resource-row"><div class="resource-name"><strong>铸造参数优化器</strong><small>APP-CUSTOM-041</small></div><span class="data-cell">工艺数字化部</span><span class="review-state pending">安全复核中</span><span class="data-cell">v0.9.2</span><button class="icon-btn row-action" data-message="已打开上架审核"><i class="icon icon-chevron-right"></i></button></div><div class="resource-row"><div class="resource-name"><strong>备件库存预测</strong><small>APP-CUSTOM-037</small></div><span class="data-cell">供应链平台组</span><span class="review-state ok">已通过</span><span class="data-cell">v1.1.0</span><button class="icon-btn row-action" data-message="已打开发布记录"><i class="icon icon-chevron-right"></i></button></div></div></section>`;
    }

    function setModule(module) {
      state.module = module;
      if (window.matchMedia('(max-width: 900px)').matches && state.viewMode === 'split') state.viewMode = 'chat';
      document.querySelectorAll('.rail-item').forEach(item => item.classList.toggle('active', item.dataset.module === module));
      document.getElementById('sidebar').classList.remove('mobile-open');
      if (module === 'workbench') { renderWorkbenchSidebar(); renderWorkbench(); }
      else { renderModuleSidebar(module); renderModulePage(module, moduleConfig[module].sections[0].items[0][0]); }
      document.getElementById('sidebarAction').disabled = state.readonly;
      document.getElementById('quickCreate').disabled = state.readonly;
      document.querySelectorAll('.primary-btn, .send-btn').forEach(button => { button.disabled = state.readonly; button.title = state.readonly ? '当前工作区为只读' : ''; });
    }

    function newSession() {
      const app = apps.find(item => item.name === state.app) || apps[0];
      const name = `新会话 ${String(app.sessions.length + 1).padStart(2, '0')}`;
      app.sessions.unshift(name);
      state.session = name;
      state.app = app.name;
      setModule('workbench');
      setTimeout(() => { const input = document.getElementById('messageInput'); input.value = ''; input.focus(); }, 50);
      showToast(`已在 ${app.name} 创建新会话`);
    }

    function openForm(title) {
      const formModes = title.includes('应用') && !title.includes('配置') ? {
        labels: ['应用名称', '运行时', '应用分类', '应用说明与权限', '发布范围', '审核流程'],
        name: '铸造参数优化器', model: ['Web Application', 'Agent Application', 'Embedded App'], team: ['生产运营', '质量管理', '设备管理'], description: '连接熔炼与铸造工艺数据，提供参数建议和批次追溯。申请读取生产数据与写入建议参数权限。', scope: ['当前工作区试用', '组织应用市场'], policy: ['安全与数据双重审核', '标准应用审核'], save: '提交审核'
      } : title.includes('成员') ? {
        labels: ['人员姓名或账号', '身份来源', '所属部门', '授权说明', '访问范围', '角色模板'],
        name: '王琳', model: ['企业目录同步', '本地账号', '外部协作账号'], team: ['质量工程部', '设备工程部', '生产运营部'], description: '负责质量缺陷分析与视觉质检应用审核。', scope: ['当前工作区', '当前部门'], policy: ['质量工程师', '工作区查看者'], save: '添加成员'
      } : title.includes('策略') ? {
        labels: ['策略名称', '触发对象', '责任群组', '策略说明', '生效范围', '处置方式'],
        name: '高风险停机指令双人审批', model: ['Agent 操作', 'MCP 调用', '应用发布'], team: ['设备可靠性 Team', '平台治理组'], description: '任何生产设备停机与关键参数写入操作，必须由业务负责人和安全负责人共同审批。', scope: ['当前工作区', '组织全局'], policy: ['阻断并发起审批', '仅告警'], save: '保存策略'
      } : {
        labels: ['名称', '基础模型', '所属 Team', '职责与边界', '作用域', '治理策略'],
        name: title.includes('配置') ? `${state.app} Agent` : '产线异常分析 Agent', model: ['Qwen3-32B-Factory', 'GPT-5 Enterprise', 'DeepSeek-R1-70B'], team: ['设备可靠性 Team', '质量管控 Team', '生产排程 Team'], description: '分析生产实时数据与历史记录，识别异常原因并给出可审核的操作建议。禁止直接下发高风险指令。', scope: ['当前工作区', '组织共享'], policy: ['生产高风险操作需审批', '只读诊断'], save: '保存草稿'
      };
      document.getElementById('formTitle').textContent = title;
      ['resourceName', 'resourceModel', 'resourceTeam', 'resourceDescription', 'resourceScope', 'resourcePolicy'].forEach((id, index) => { document.querySelector(`label[for="${id}"]`).textContent = formModes.labels[index]; });
      document.getElementById('resourceName').value = formModes.name;
      document.getElementById('resourceModel').innerHTML = formModes.model.map(item => `<option>${item}</option>`).join('');
      document.getElementById('resourceTeam').innerHTML = formModes.team.map(item => `<option>${item}</option>`).join('');
      document.getElementById('resourceDescription').value = formModes.description;
      document.getElementById('resourceScope').innerHTML = formModes.scope.map(item => `<option>${item}</option>`).join('');
      document.getElementById('resourcePolicy').innerHTML = formModes.policy.map(item => `<option>${item}</option>`).join('');
      document.getElementById('saveResource').innerHTML = `<i class="icon icon-check"></i>${formModes.save}`;
      document.getElementById('formOverlay').classList.add('open');
      setTimeout(() => document.getElementById('resourceName').focus(), 50);
    }

    function openCommand() {
      document.getElementById('commandOverlay').classList.add('open');
      const input = document.getElementById('commandInput');
      input.value = '';
      renderCommandResults('');
      setTimeout(() => input.focus(), 50);
    }

    const commandItems = [
      ['设备健康中心', '应用', 'activity', 'workbench'], ['质量缺陷分析', '应用', 'scan-line', 'workbench'], ['预测性维护中心', '市场应用', 'blocks', 'market'], ['设备诊断 Agent', 'Agent', 'bot', 'build'], ['设备可靠性 Team', 'Team', 'network', 'build'], ['视觉质检 Skill', 'Skill', 'wrench', 'build'], ['factory-data-hub', 'MCP Server', 'server-cog', 'build'], ['王琳', '人员', 'user-round', 'organization'], ['策略与护栏', '治理', 'shield-check', 'governance']
    ];
    function renderCommandResults(query) {
      const filtered = commandItems.filter(item => item[0].toLowerCase().includes(query.toLowerCase()) || item[1].toLowerCase().includes(query.toLowerCase()));
      document.getElementById('commandResults').innerHTML = filtered.length ? `<div class="command-group-label">搜索结果</div>${filtered.map((item, index) => `<button class="command-result ${index === 0 ? 'active' : ''}" data-module="${item[3]}" data-target="${item[0]}"><i class="icon icon-${item[2]}"></i><span>${item[0]}</span><small>${item[1]}</small></button>`).join('')}` : '<div class="command-group-label">没有匹配结果</div>';
      document.querySelectorAll('.command-result').forEach(button => button.addEventListener('click', () => { navigateCommand(button); closeOverlays(); }));
    }

    function navigateCommand(button) {
      const module = button.dataset.module;
      const target = button.dataset.target;
      const app = apps.find(item => item.name === target);
      if (app) { state.app = app.name; state.session = app.sessions[0]; setModule('workbench'); return; }
      setModule(module);
      if (module !== 'workbench') {
        renderModulePage(module, target);
        sidebarContent.querySelectorAll('.side-item').forEach(item => item.classList.toggle('active', item.dataset.item === target || item.textContent.trim().startsWith(target)));
      }
    }

    function closeOverlays() { document.querySelectorAll('.overlay').forEach(overlay => overlay.classList.remove('open')); }
    function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }

    document.querySelectorAll('.rail-item').forEach(button => button.addEventListener('click', () => setModule(button.dataset.module)));
    document.getElementById('sidebarAction').addEventListener('click', () => state.module === 'workbench' ? newSession() : openForm({ market: '提交制造业应用', organization: '添加组织成员', governance: '创建治理策略', settings: '创建平台配置', build: '创建 Agent' }[state.module]));
    document.getElementById('quickCreate').addEventListener('click', () => openForm('创建 Agent'));
    document.getElementById('commandTrigger').addEventListener('click', openCommand);
    document.getElementById('commandInput').addEventListener('input', event => renderCommandResults(event.target.value));
    document.getElementById('notifications').addEventListener('click', () => showToast('2 个风险事件与 6 个访问申请待处理'));
    document.getElementById('themeToggle').addEventListener('click', () => { state.theme = state.theme === 'dark' ? 'light' : 'dark'; document.body.dataset.theme = state.theme; showToast(state.theme === 'dark' ? '已切换深色控制室' : '已切换亮色模式'); });
    document.getElementById('workspaceTrigger').addEventListener('click', event => { const menu = document.getElementById('workspaceMenu'); const rect = event.currentTarget.getBoundingClientRect(); menu.style.left = `${rect.left}px`; menu.style.top = `${rect.bottom + 6}px`; menu.classList.toggle('open'); });
    document.querySelectorAll('.workspace-option').forEach(button => button.addEventListener('click', () => { state.workspace = button.dataset.workspace; state.readonly = button.dataset.readonly === 'true'; document.getElementById('workspaceName').textContent = state.workspace; document.querySelector('.workspace-button .workspace-symbol').textContent = button.dataset.code; document.querySelector('.workspace-button .workspace-meta').textContent = button.dataset.meta; document.querySelectorAll('.workspace-option').forEach(item => item.classList.remove('active')); button.classList.add('active'); document.getElementById('workspaceMenu').classList.remove('open'); setModule(state.module); showToast(`已切换到 ${state.workspace}${state.readonly ? ' · 只读' : ''}`); }));
    document.querySelectorAll('.modal-close').forEach(button => button.addEventListener('click', closeOverlays));
    document.querySelectorAll('.overlay').forEach(overlay => overlay.addEventListener('click', event => { if (event.target === overlay) closeOverlays(); }));
    document.getElementById('saveResource').addEventListener('click', () => { closeOverlays(); showToast('资源草稿已保存'); });
    document.addEventListener('keydown', event => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') { event.preventDefault(); openCommand(); }
      if (event.key === 'Escape') { closeOverlays(); document.getElementById('workspaceMenu').classList.remove('open'); }
      if (event.key === 'Enter' && document.getElementById('commandOverlay').classList.contains('open')) { const active = document.querySelector('.command-result.active'); if (active) { navigateCommand(active); closeOverlays(); } }
    });
    document.addEventListener('click', event => { if (!event.target.closest('#workspaceMenu') && !event.target.closest('#workspaceTrigger')) document.getElementById('workspaceMenu').classList.remove('open'); });

    setModule('workbench');
  </script>
</body>
</html>
